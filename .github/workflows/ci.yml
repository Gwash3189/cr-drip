name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.21.0

      - name: Check formatting
        run: crystal tool format --check src spec

      - name: Run specs
        run: crystal spec --error-on-warnings
